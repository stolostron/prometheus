version: "2"
linters:
  enable:
    - depguard
    - errorlint
    - gocritic
    - godot
    - misspell
    - nolintlint
    - predeclared
    - revive
    - testifylint
    - unconvert
    - usestdlibvars
    - whitespace
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: sync/atomic
              desc: Use go.uber.org/atomic instead of sync/atomic
            - pkg: github.com/stretchr/testify/assert
              desc: Use github.com/stretchr/testify/require instead of github.com/stretchr/testify/assert
            - pkg: github.com/go-kit/kit/log
              desc: Use github.com/go-kit/log instead of github.com/go-kit/kit/log
            - pkg: io/ioutil
              desc: Use corresponding 'os' or 'io' functions instead.
            - pkg: regexp
              desc: Use github.com/grafana/regexp instead of regexp
            - pkg: github.com/pkg/errors
              desc: Use 'errors' or 'fmt' instead of github.com/pkg/errors
            - pkg: gzip
              desc: Use github.com/klauspost/compress instead of gzip
            - pkg: zlib
              desc: Use github.com/klauspost/compress instead of zlib
            - pkg: golang.org/x/exp/slices
              desc: Use 'slices' instead.
    errcheck:
      exclude-functions:
        - io.Copy
        - io.WriteString
        - (net/http.ResponseWriter).Write
        - (*net/http.Server).Shutdown
        - (github.com/go-kit/log.Logger).Log
        - (github.com/prometheus/prometheus/storage.Appender).Rollback
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: '*testing.T,testing.TB'
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
          disabled: true
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
          disabled: true
        - name: var-declaration
        - name: var-naming
    # v2.4.0's bundled linters flag pre-existing upstream code. Keep the
    # checks that already pass and turn off the ones that do not.
    predeclared:
      ignore:
        - min
        - max
        - clear
    staticcheck:
      checks:
        - all
        - -QF*
        - -SA6006
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1011
        - -ST1012
        - -ST1016
        - -ST1019
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
    testifylint:
      enable:
        - bool-compare
        - compares
        - error-is-as
        - error-nil
        - expected-actual
        - require-error
        - suite-dont-use-pkg
        - suite-extra-assert-call
      disable:
        - contains
        - empty
        - encoded-compare
        - equal-values
        - float-compare
        - formatter
        - go-require
        - len
        - negative-positive
    usestdlibvars:
      http-status-code: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocritic
        text: appendAssign
      - linters:
          - errcheck
        path: _test.go
      - linters:
          - errorlint
        path: tsdb/head_wal.go
      - linters:
          - godot
        source: ^// ===
    paths:
      - third_party$
      - builtin$
      - (^|/)examples(/|$)
      - storage/remote/otlptranslator/prometheusremotewrite
      - storage/remote/otlptranslator/prometheus
      - \.(pb|y)\.go$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/prometheus/prometheus
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - (^|/)examples(/|$)
      - storage/remote/otlptranslator/prometheusremotewrite
      - storage/remote/otlptranslator/prometheus
      - \.(pb|y)\.go$

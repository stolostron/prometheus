  #       run: sudo apt-get update && sudo apt-get -y install libsnmp-dev
  #       if: github.repository == 'prometheus/snmp_exporter'
  #     - name: Lint
  #       uses: golangci/golangci-lint-action@1481404843c368bc19ca9406f87d6e0fc97bdcfd # v7.0.0
  #       with:
  #         args: --verbose
  #         # Make sure to sync this with Makefile.common and scripts/golangci-lint.yml.
  #         version: v2.9.0
  # Disabled: CIFuzz uses google/oss-fuzz@master which has moved to the new
  # util/fuzzing/ layout incompatible with the old promql/fuzz.go targets on
  # this branch. See https://github.com/prometheus/prometheus/issues/17941
  # fuzzing:
  #   uses: ./.github/workflows/fuzzing.yml
  #   if: github.event_name == 'pull_request'
  codeql:
    uses: ./.github/workflows/codeql-analysis.yml
    permissions:
      contents: read
      security-events: write
